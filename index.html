<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 문제집 회전체 인식기</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: var(--card-bg);
      padding: 0.8rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.15rem; font-weight: 700; color: var(--accent-color); }
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
    }
    .panel {
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
    }
    .left-panel {
      flex: 1;
      max-width: 420px;
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
    }
    .right-panel {
      flex: 2;
      background: #020617;
      position: relative;
    }
    .controls {
      background: var(--card-bg);
      padding: 0.9rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .btn {
      width: 100%;
      padding: 0.65rem;
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn:hover { background: #7dd3fc; }
    .file-wrapper {
      position: relative;
      overflow: hidden;
    }
    input[type=file] {
      position: absolute;
      left: 0; top: 0; opacity: 0;
      width: 100%; height: 100%;
      cursor: pointer;
    }
    .radio-group, .slider-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .slider-group label { width: 110px; flex-shrink: 0; }
    .slider-group input { flex: 1; }
    .canvas-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    canvas { width: 100%; display: block; cursor: crosshair; }
    #status {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 600;
    }
    .instruction {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.3;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <h1>문제집 사진 전용 3D 회전체 자동 변환기</h1>
    <div id="status">사진을 업로드해주세요.</div>
  </header>

  <div class="container">
    <div class="panel left-panel">
      <div class="controls">
        <div class="file-wrapper">
          <button class="btn">📷 문제집/도형 사진 업로드</button>
          <input type="file" id="imageLoader" accept="image/*">
        </div>

        <div class="radio-group">
          <label>도형 위치:</label>
          <label><input type="radio" name="side" value="left" checked> 축 왼쪽</label>
          <label><input type="radio" name="side" value="right"> 축 오른쪽</label>
        </div>

        <div class="slider-group">
          <label>회전축 위치(X):</label>
          <input type="range" id="axisPos" min="0" max="100" value="68">
        </div>

        <div class="slider-group">
          <label>상단 잘라내기:</label>
          <input type="range" id="cropTop" min="0" max="50" value="15">
        </div>

        <div class="slider-group">
          <label>하단 잘라내기:</label>
          <input type="range" id="cropBottom" min="50" max="100" value="85">
        </div>

        <div class="slider-group">
          <label>선 감지 민감도:</label>
          <input type="range" id="threshold" min="50" max="230" value="180">
        </div>

        <p class="instruction">💡 <b>팁:</b> 슬라이더로 상/하단을 조절해 상단의 <u>회전 화살표</u>를 제외시키면 깔끔한 입체도형이 생성됩니다.</p>
      </div>

      <div class="canvas-container">
        <canvas id="cvCanvas"></canvas>
      </div>
    </div>

    <div class="panel right-panel" id="threeContainer"></div>
  </div>

  <script>
    const imageLoader = document.getElementById('imageLoader');
    const cvCanvas = document.getElementById('cvCanvas');
    const ctx = cvCanvas.getContext('2d');
    
    const axisPosInput = document.getElementById('axisPos');
    const cropTopInput = document.getElementById('cropTop');
    const cropBottomInput = document.getElementById('cropBottom');
    const thresholdInput = document.getElementById('threshold');
    const statusText = document.getElementById('status');
    const sideRadios = document.querySelectorAll('input[name="side"]');

    let currentImg = null;

    imageLoader.addEventListener('change', handleImage);
    axisPosInput.addEventListener('input', processImage);
    cropTopInput.addEventListener('input', processImage);
    cropBottomInput.addEventListener('input', processImage);
    thresholdInput.addEventListener('input', processImage);
    sideRadios.forEach(r => r.addEventListener('change', processImage));

    function handleImage(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        currentImg = new Image();
        currentImg.onload = function() {
          cvCanvas.width = currentImg.width;
          cvCanvas.height = currentImg.height;
          processImage();
        }
        currentImg.src = event.target.result;
      }
      if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    }

    function processImage() {
      if (!currentImg) return;

      const w = cvCanvas.width;
      const h = cvCanvas.height;

      ctx.drawImage(currentImg, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const thresh = parseInt(thresholdInput.value);
      const axisX = Math.floor(w * (parseInt(axisPosInput.value) / 100));
      const cropTopY = Math.floor(h * (parseInt(cropTopInput.value) / 100));
      const cropBottomY = Math.floor(h * (parseInt(cropBottomInput.value) / 100));
      
      let side = 'left';
      sideRadios.forEach(r => { if(r.checked) side = r.value; });

      const profilePoints = [];
      const stepY = Math.max(1, Math.floor((cropBottomY - cropTopY) / 50));

      for (let y = cropTopY; y <= cropBottomY; y += stepY) {
        let detectedX = -1;

        if (side === 'left') {
          // 축의 왼쪽 방향으로 스캔하여 가장 먼 도형 윤곽선 탐색
          for (let x = 0; x < axisX - 3; x++) {
            const idx = (y * w + x) * 4;
            const r = data[idx], g = data[idx+1], b = data[idx+2];
            
            // 빨간색 축 선 제외 & 어두운 윤곽선/도형 내부 감지
            const isRedAxis = (r > 130 && r > g + 40 && r > b + 40);
            const brightness = (r + g + b) / 3;

            if (!isRedAxis && brightness < thresh) {
              detectedX = x;
              break;
            }
          }
        } else {
          // 축의 오른쪽 방향으로 스캔
          for (let x = w - 1; x > axisX + 3; x--) {
            const idx = (y * w + x) * 4;
            const r = data[idx], g = data[idx+1], b = data[idx+2];

            const isRedAxis = (r > 130 && r > g + 40 && r > b + 40);
            const brightness = (r + g + b) / 3;

            if (!isRedAxis && brightness < thresh) {
              detectedX = x;
              break;
            }
          }
        }

        if (detectedX !== -1) {
          const radius = Math.abs(detectedX - axisX);
          // 3D 좌표 변환
          const normY = ((h / 2) - y) / (h / 2) * 1.5;
          const normR = (radius / (w / 2)) * 1.5;
          profilePoints.push({ r: normR, y: normY, origX: detectedX, origY: y });
        }
      }

      // --- 2D 시각화 표시 ---
      ctx.drawImage(currentImg, 0, 0, w, h);

      // 1. 빨간색 회전축 표시
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(axisX, 0); ctx.lineTo(axisX, h);
      ctx.stroke();

      // 2. 잘라내기 영역 표시 (노란 가로선)
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, cropTopY); ctx.lineTo(w, cropTopY);
      ctx.moveTo(0, cropBottomY); ctx.lineTo(w, cropBottomY);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3. 감지된 윤곽선 표시 (청록색)
      ctx.strokeStyle = '#38bdf8';
      ctx.fillStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      profilePoints.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.origX, p.origY);
        else ctx.lineTo(p.origX, p.origY);
        
        ctx.fillRect(p.origX - 2, p.origY - 2, 5, 5);
      });
      ctx.stroke();

      statusText.innerText = `정확히 ${profilePoints.length}개 외곽선 포인트를 인식했습니다.`;

      // 3D 렌더링 업데이트
      const threePoints = profilePoints.map(p => new THREE.Vector2(p.r, p.y));
      update3DSolid(threePoints);
    }

    // --- Three.js 3D 모듈 ---
    let scene, camera, renderer, controls, currentMesh;

    function init3D() {
      const container = document.getElementById('threeContainer');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(3, 1.5, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(10, 10, 0x38bdf8, 0x1e293b);
      scene.add(grid);

      animate();
    }

    function update3DSolid(points) {
      if (!points || points.length < 2) return;

      if (currentMesh) scene.remove(currentMesh);

      const geometry = new THREE.LatheGeometry(points, 64, 0, Math.PI * 2);
      const material = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        roughness: 0.3,
        metalness: 0.1,
        side: THREE.DoubleSide
      });

      currentMesh = new THREE.Mesh(geometry, material);
      scene.add(currentMesh);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const container = document.getElementById('threeContainer');
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    init3D();
  </script>
</body>
</html>
