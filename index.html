<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자동 인식 3D 회전체 생성기</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent-color); }
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
      position: relative;
    }
    .left-panel { border-right: 1px solid #334155; max-width: 450px; }
    .right-panel { flex: 2; background: #000; }
    .controls {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn:hover { background: #7dd3fc; }
    input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 350px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed #475569;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }
    .slider-group input { flex: 1; }
    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <h1>AI 자동 윤곽선 인식 3D 회전체 생성기</h1>
    <div id="status">사진을 업로드하면 자동으로 도형을 인식합니다.</div>
  </header>

  <div class="container">
    <!-- 좌측: 2D 이미지 및 자동 인식 캔버스 -->
    <div class="panel left-panel">
      <div class="controls">
        <div class="file-input-wrapper">
          <button class="btn">📷 사진/도형 이미지 업로드</button>
          <input type="file" id="imageLoader" accept="image/*">
        </div>
        
        <div class="slider-group">
          <label>민감도(Threshold):</label>
          <input type="range" id="threshold" min="50" max="230" value="150">
        </div>
        
        <div class="slider-group">
          <label>회전축 위치(X):</label>
          <input type="range" id="axisPos" min="0" max="100" value="50">
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="cvCanvas"></canvas>
      </div>
    </div>

    <!-- 우측: 3D 회전체 시각화 -->
    <div class="panel right-panel" id="threeContainer"></div>
  </div>

  <script>
    // --- 2D 이미지 처리 및 자동 윤곽선 인식 ---
    const imageLoader = document.getElementById('imageLoader');
    const cvCanvas = document.getElementById('cvCanvas');
    const ctx = cvCanvas.getContext('2d');
    const thresholdInput = document.getElementById('threshold');
    const axisPosInput = document.getElementById('axisPos');
    const statusText = document.getElementById('status');

    let currentImg = null;
    let detectedProfile = []; // 추출된 2D 포인트 배열 (r, y)

    imageLoader.addEventListener('change', handleImage, false);
    thresholdInput.addEventListener('input', processImage);
    axisPosInput.addEventListener('input', processImage);

    function handleImage(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        currentImg = new Image();
        currentImg.onload = function() {
          cvCanvas.width = currentImg.width;
          cvCanvas.height = currentImg.height;
          processImage();
        }
        currentImg.src = event.target.result;
      }
      if(e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    }

    // 자동 인식 알고리즘 Engine
    function processImage() {
      if (!currentImg) return;

      const w = cvCanvas.width;
      const h = cvCanvas.height;

      // 1. 이미지 그리기
      ctx.drawImage(currentImg, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const thresh = parseInt(thresholdInput.value);
      const axisX = Math.floor(w * (parseInt(axisPosInput.value) / 100));

      detectedProfile = [];
      const stepY = Math.max(1, Math.floor(h / 60)); // 60개 샘플링 지점

      // 2. 수직 축을 기준으로 각 높이별 외곽선(픽셀) 탐색
      for (let y = 0; y < h; y += stepY) {
        let maxR = 0;
        
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const brightness = (data[idx] + data[idx+1] + data[idx+2]) / 3;

          // 어두운 선/도형 감지 (Threshold 이하)
          if (brightness < thresh) {
            const r = Math.abs(x - axisX);
            if (r > maxR) maxR = r; // 회전축으로부터의 최대 반경 측정
          }
        }

        // Three.js 좌표계로 정규화 (-1.5 ~ 1.5)
        const normY = ((h / 2) - y) / (h / 2) * 2;
        const normR = (maxR / (w / 2)) * 2;

        detectedProfile.push(new THREE.Vector2(normR, normY));
      }

      // 3. 2D 캔버스에 감지된 외곽선 & 회전축 시각화 표출
      ctx.drawImage(currentImg, 0, 0, w, h);
      
      // 회전축 (빨간선)
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(axisX, 0);
      ctx.lineTo(axisX, h);
      ctx.stroke();

      // 감지된 윤곽선 (녹색 점)
      ctx.fillStyle = '#00ff00';
      detectedProfile.forEach((p, idx) => {
        const origY = h/2 - (p.y * (h/2) / 2);
        const origX = axisX + (p.x * (w/2) / 2);
        ctx.beginPath();
        ctx.arc(origX, origY, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      statusText.innerText = `성공적으로 ${detectedProfile.length}개 외곽 포인트 감지 완료!`;

      // 4. 3D 입체도형 즉시 재생성
      update3DSolid(detectedProfile);
    }

    // --- 3D Three.js 렌더링 엔진 ---
    let scene, camera, renderer, controls, currentMesh;

    function init3D() {
      const container = document.getElementById('threeContainer');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(3, 2, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 조명 설정
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      // 회전축 기준 그리드
      const grid = new THREE.GridHelper(10, 10, 0x38bdf8, 0x334155);
      scene.add(grid);

      // 기본 데모 도형 생성
      createDefaultShape();

      animate();
    }

    function createDefaultShape() {
      const pts = [];
      for (let i = 0; i <= 20; i++) {
        const y = (i / 20) * 2 - 1;
        const r = Math.sin(i / 20 * Math.PI) * 0.8 + 0.2;
        pts.push(new THREE.Vector2(r, y));
      }
      update3DSolid(pts);
    }

    function update3DSolid(points) {
      if (!points || points.length < 2) return;

      if (currentMesh) scene.remove(currentMesh);

      // 회전체 메쉬 생성 (LatheGeometry)
      const geometry = new THREE.LatheGeometry(points, 64, 0, Math.PI * 2);
      const material = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        roughness: 0.3,
        metalness: 0.2,
        side: THREE.DoubleSide,
        wireframe: false
      });

      currentMesh = new THREE.Mesh(geometry, material);
      scene.add(currentMesh);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const container = document.getElementById('threeContainer');
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    init3D();
  </script>
</body>
</html>
